    <script>
      // Defensively define fetch with getter and setter so browser extension interceptors
      // (e.g. ad blockers, request loggers) attempting to patch `window.fetch = ...` succeed
      // without throwing "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var realFetch = window.fetch;
          var customFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || realFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        // Global handler to prevent third-party extension errors from bubbling to console or breaking execution
        window.addEventListener('error', function(e) {
          if (e.filename && (e.filename.indexOf('chrome-extension://') !== -1 || e.filename.indexOf('moz-extension://') !== -1)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
